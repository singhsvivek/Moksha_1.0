version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: moksha_postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # The Brain
  moksha_bot:
    build: .
    container_name: moksha_engine
    restart: always # Auto-restart on crash
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src # Live code updates
      - ./moksha_nn3.pth:/app/moksha_nn3.pth # Persist the trained model

volumes:
  postgres_data: