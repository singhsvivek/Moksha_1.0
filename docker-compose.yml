
services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: moksha_postgres
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
      
  # The Brain
# The Brain
  moksha_bot:
    build: .
    container_name: moksha_engine
    restart: always
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres 
      - TZ=America/Chicago  # <--- ADD THIS LINE
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
      - ./moksha_nn3.pth:/app/moksha_nn3.pth
      - ./logs:/app/logs   # <--- ADD THIS LINE (Shared Volume)

  # The Cockpit
  # The Cockpit
  moksha_dashboard:
    build: .
    container_name: moksha_ui
    # CHANGE THIS LINE: Remove 'poetry run'
    command: streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
    restart: always
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - TZ=America/Chicago
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    depends_on:
      - postgres

  equity_engine:
    build: .
    container_name: moksha_equity
    command: python src/production_equity.py  # Removed 'poetry run'
    restart: always
    env_file: .env
    environment:
      - TZ=America/Chicago
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    depends_on:
      - postgres

  silver_engine:
    build: .
    container_name: moksha_silver
    command: python src/production_silver.py  # Removed 'poetry run'
    restart: always
    env_file: .env
    environment:
      - TZ=America/Chicago
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    depends_on:
      - postgres
      
volumes:
  postgres_data: